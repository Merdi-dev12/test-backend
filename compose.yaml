services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ziko
      POSTGRES_PASSWORD: ziko
      POSTGRES_DB: ziko
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ziko -d ziko"]
      interval: 5s
      timeout: 5s
      retries: 10
  migrate:
    build:
      context: .
      target: build
    working_dir: /app
    environment:
      DATABASE_URL: postgresql://ziko:ziko@db:5432/ziko
    command: npm run db:migrate
    depends_on:
      db:
        condition: service_healthy
  api:
    build: .
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://ziko:ziko@db:5432/ziko
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  postgres_data:
